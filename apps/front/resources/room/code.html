<style>
        /* Custom Audio Wave Animation */
        .audio-wave {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 24px;
            justify-content: center;
        }
        .audio-wave span {
            display: block;
            width: 4px;
            background-color: currentColor;
            border-radius: 2px;
            animation: wave 1s ease-in-out infinite;
            transform-origin: center;
        }
        .audio-wave span:nth-child(1) { animation-delay: 0.0s; height: 40%; }
        .audio-wave span:nth-child(2) { animation-delay: 0.2s; height: 80%; }
        .audio-wave span:nth-child(3) { animation-delay: 0.4s; height: 100%; }
        .audio-wave span:nth-child(4) { animation-delay: 0.6s; height: 70%; }
        .audio-wave span:nth-child(5) { animation-delay: 0.8s; height: 50%; }

        @keyframes wave {
            0%, 100% { transform: scaleY(0.4); }
            50% { transform: scaleY(1); }
        }

        /* Pulsing Ring for Speaker */
        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.15); opacity: 0; }
        }
        .animate-pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
    </style>
</head>
