# Stack del API: Nginx + 3 réplicas de NestJS + Dozzle.
#
# El FRONT NO está acá: va en Vercel. Este droplet solo corre el backend.
#
#   docker compose up --build        levantar todo
#   docker compose up -d --build api1   redeploy de UNA réplica (sin corte)
#
# Se accede por:
#   http://localhost        → el API (en prod: api.tudominio.com)
#   http://localhost:9999   → Dozzle (logs de todos los contenedores)
#
# Como el front vive en otro origen (Vercel), el CORS SIGUE HACIENDO FALTA:
# hay que poner la URL de Vercel en CORS_ORIGIN dentro de apps/api/.env.
#
# Redis (Upstash) y Postgres (Neon) siguen siendo los de la nube: ya están
# andando y meterlos acá obligaría a migrar datos. Las credenciales salen de
# apps/api/.env, que está gitignored.

services:
  # ------------------------------------------------------------------
  # Caddy: reverse proxy + HTTPS automático.
  #
  # Reemplaza a nginx porque saca y renueva el certificado de Let's Encrypt solo
  # (sin certbot ni cron). Necesita los puertos 80 y 443 abiertos: el 80 es por
  # donde Let's Encrypt valida el dominio.
  #
  # Los volúmenes `caddy_data` y `caddy_config` guardan los certificados: sin
  # ellos, cada reinicio pediría uno nuevo y Let's Encrypt tiene límite semanal.
  # ------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api1
      - api2
    restart: unless-stopped

  # ------------------------------------------------------------------
  # API — dos réplicas (no tres): en un droplet de 1 GB cada proceso Nest ocupa
  # ~100 MB, y con dos ya se consigue lo que importa —deploys sin corte total y
  # aguante si una crashea—. La tercera sumaba consumo sin beneficio real a esta
  # escala.
  #
  # Servicios nombrados en vez de `--scale api=2`.
  #
  # Nginx no descubre contenedores (eso lo haría Traefik), así que necesita
  # nombres fijos en su upstream. Con api1/api2 el DNS de Docker resuelve
  # y no hay que tocar nada al reiniciar.
  #
  # NINGUNO publica puertos al host: solo Nginx es alcanzable desde afuera.
  # ------------------------------------------------------------------
  api1:
    # Solo api1 declara `build`. Las otras dos reutilizan la MISMA imagen por su
    # nombre: sin `image:` compartido, Docker construye una imagen por servicio
    # y el `npm ci` (varios minutos en 1 vCPU) se repite tres veces.
    image: talktome-api:latest
    build:
      context: .                      # la RAÍZ del monorepo (workspaces)
      dockerfile: apps/api/Dockerfile
    env_file:
      - apps/api/.env
    environment:
      PORT: 3000
      NODE_ENV: production
      INSTANCE_ID: api1               # lo devuelve /health/stats
    # Margen para que el graceful shutdown cierre los SSE antes del SIGKILL.
    # Debe ser MAYOR que el timeout interno del apagado (1,5s).
    stop_grace_period: 15s
    restart: unless-stopped

  # api2 NO hereda de api1: si heredara, arrastraría su bloque `build`
  # y Docker compilaría la misma imagen dos veces (varios minutos cada una en
  # 1 vCPU). Declara solo `image`, así reutiliza la que ya construyó api1.
  api2:
    image: talktome-api:latest
    env_file:
      - apps/api/.env
    stop_grace_period: 15s
    restart: unless-stopped
    depends_on: [api1]
    environment:
      PORT: 3000
      NODE_ENV: production
      INSTANCE_ID: api2

  # ------------------------------------------------------------------
  # Dozzle: logs de TODOS los contenedores en una web.
  #
  # No levanta nada ni orquesta: solo lee el socket de Docker y muestra. Es la
  # forma de seguir un mensaje que entra por api1 y sale por api2, con los
  # prefijos que ya tienen los logs ([SSE-01], [ROOM-02]…).
  #
  # El socket va :ro y NO se publica el puerto en producción sin protegerlo:
  # quien accede a Dozzle ve los logs de todo el stack.
  # ------------------------------------------------------------------
  dozzle:
    image: amir20/dozzle:latest
    ports:
      # 127.0.0.1 y no 0.0.0.0: Dozzle muestra los logs de TODO el stack, así
      # que NO debe quedar accesible desde internet. Se llega por túnel SSH:
      #   ssh -L 9999:localhost:9999 root@droplet
      - '127.0.0.1:9999:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_NO_ANALYTICS: 'true'
    restart: unless-stopped

volumes:
  # Certificados TLS. Persistirlos evita re-solicitarlos en cada reinicio
  # (Let's Encrypt limita las emisiones por semana).
  caddy_data:
  caddy_config:
