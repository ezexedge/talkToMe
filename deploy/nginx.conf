# Nginx como reverse proxy del API.
#
# Solo enruta al backend: el front está en Vercel, no acá.
#   /signaling   → API (señalización + SSE)
#   /users       → API
#   /health      → API
#
# Como el front vive en OTRO origen (Vercel), el CORS lo sigue manejando Nest
# vía CORS_ORIGIN. Nginx no lo resuelve — solo lo haría si sirviera ambos desde
# el mismo host.
#
# En producción este es además el lugar del certificado TLS (certbot).

events {
  worker_connections 4096;  # cada SSE abierto ocupa una: subir si hay muchos.
}

http {
  # El front y el API se resuelven por el DNS interno de Docker.
  resolver 127.0.0.11 valid=10s;

  # ------------------------------------------------------------------
  # Las 2 réplicas del API.
  #
  # Se nombran una por una y NO se usa `--scale`: Nginx no descubre
  # contenedores (eso lo haría Traefik leyendo el socket de Docker). Con
  # servicios nombrados, el DNS de Docker resuelve api1/api2 y alcanza.
  #
  # least_conn y no round-robin: en esta app cada cliente mantiene un SSE
  # ABIERTO, así que la carga real de una réplica es cuántas conexiones tiene
  # vivas. Round-robin reparte por turnos y se desbalancea con el tiempo
  # (alguien cuelga, otro entra); least_conn manda al que menos tiene.
  # ------------------------------------------------------------------
  upstream api_backend {
    least_conn;
    server api1:3000 max_fails=2 fail_timeout=10s;
    server api2:3000 max_fails=2 fail_timeout=10s;
  }

  # Logs con el upstream que atendió cada request: sirve para verificar que el
  # balanceo reparte de verdad entre las réplicas.
  log_format upstreamlog '$remote_addr → $upstream_addr "$request" '
                         '$status ${upstream_response_time}s';
  access_log /var/log/nginx/access.log upstreamlog;

  server {
    listen 80;
    server_name _;

    # ----------------------------------------------------------------
    # SSE — el bloque más delicado de todo el archivo.
    #
    # Va PRIMERO y con `location =` (match exacto) para que gane sobre el
    # /signaling/ genérico de abajo.
    #
    # Sin `proxy_buffering off`, Nginx acumula la respuesta antes de mandarla:
    # los mensajes de señalización llegarían en lotes o no llegarían, y el
    # síntoma sería "el server no responde" cuando en realidad responde bien.
    # ----------------------------------------------------------------
    location = /signaling/stream {
      proxy_pass http://api_backend;
      proxy_http_version 1.1;

      proxy_buffering off;            # entregar cada evento al instante
      proxy_cache off;
      chunked_transfer_encoding off;

      # Un SSE vive indefinidamente. Con el timeout por defecto (60s) Nginx
      # cortaría la conexión en medio de la llamada.
      proxy_read_timeout 24h;
      proxy_send_timeout 24h;

      # Vaciar Connection: el default 'close' cerraría el stream enseguida.
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Resto del API: POST de señalización, /users, /health.
    location ~ ^/(signaling|users|health) {
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cualquier otra ruta no corresponde a este host: el front está en Vercel.
    location / {
      return 404;
    }
  }
}
